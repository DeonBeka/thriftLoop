# Continuous delivery: tagging a version (e.g. `git tag v1.1.0 && git push --tags`) runs the full
# test suite and publishes ready-to-ship artifacts on a GitHub Release. Nothing is deployed to a server.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: ThriftLoop/backend
        run: |
          pip install -r requirements.txt
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: App type-check
        working-directory: ThriftLoop/frontend
        run: |
          npm ci
          npx tsc --noEmit

  package:
    name: Build release artifacts
    needs: test
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Backend Docker image
        run: |
          docker build -t thriftloop-api:${GITHUB_REF_NAME} ThriftLoop/backend
          docker save thriftloop-api:${GITHUB_REF_NAME} | gzip > thriftloop-api-${GITHUB_REF_NAME}.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: App bundles (iOS + web)
        working-directory: ThriftLoop/frontend
        run: |
          npm ci
          npx expo export --platform ios --platform web --output-dir dist
          tar -czf ../../thriftloop-app-${GITHUB_REF_NAME}.tar.gz -C dist .

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            thriftloop-api-${{ github.ref_name }}.tar.gz
            thriftloop-app-${{ github.ref_name }}.tar.gz

      - name: Keep artifacts for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: thriftloop-build
          path: "*.tar.gz"
