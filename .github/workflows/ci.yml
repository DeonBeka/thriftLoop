# Continuous integration: lint, type-check, test and build every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ThriftLoop/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ThriftLoop/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (Ruff)
        run: ruff check app tests

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: App · type-check + iOS bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ThriftLoop/frontend
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ThriftLoop/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (TypeScript)
        run: npx tsc --noEmit

      - name: Bundle the iOS app (catches import / build errors)
        run: npx expo export --platform ios --output-dir dist

  docker:
    name: Backend · Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ThriftLoop/backend
          push: false
          tags: thriftloop-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
