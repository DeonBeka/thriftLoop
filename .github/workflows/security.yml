# Security checks on every push / PR, plus a weekly scan for newly disclosed vulnerabilities.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Backend · Bandit + pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ThriftLoop/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install bandit[toml] pip-audit
      - name: Static analysis (Bandit)
        run: bandit -c pyproject.toml -r app
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  node:
    name: App · npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ThriftLoop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Production dependencies (fail on high / critical)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Free for public repositories; private repositories need GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
