# Weekly dependency update PRs. Expo packages are pinned to the SDK, so only minor/patch npm
# updates are proposed; SDK upgrades are done deliberately with `npx expo install --fix`.
version: 2
updates:
  - package-ecosystem: pip
    directory: /ThriftLoop/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /ThriftLoop/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, app]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo*"
      - dependency-name: "react-native*"
      - dependency-name: "react"
      - dependency-name: "react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
