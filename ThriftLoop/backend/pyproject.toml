[project]
name = "thriftloop-api"
version = "1.0.0"
description = "FastAPI + SQLite backend for the ThriftLoop second-hand fashion marketplace"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
  "E501",  # long lines are handled by the formatter / readability
  "B008",  # FastAPI's `Depends(...)` / `File(...)` defaults are the intended pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401"]  # pytest fixtures are re-imported by name

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
